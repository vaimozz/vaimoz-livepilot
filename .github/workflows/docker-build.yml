name: Docker Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        run: docker build -t vaimoz-livepilot:ci .
        
      - name: Build summary
        run: |
          echo "✅ Docker image built successfully" >> $GITHUB_STEP_SUMMARY
          echo "📦 Image: vaimoz-livepilot:ci" >> $GITHUB_STEP_SUMMARY
          echo "🔧 Node.js: 24 (forced)" >> $GITHUB_STEP_SUMMARY
