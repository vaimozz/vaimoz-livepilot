services:
  vaimoz-livepilot:
    build: .
    container_name: vaimoz-livepilot
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      # Override these in .env for custom domain deployments
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:8787}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8787}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8787/api/youtube/callback}
