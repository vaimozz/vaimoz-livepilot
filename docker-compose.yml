services:
  vaimoz-livepilot:
    build: .
    container_name: vaimoz-livepilot
    restart: unless-stopped
    ports:
      # Port di host bisa dikonfigurasi via .env, container selalu expose 8787
      - "${HOST_PORT:-8787}:8787"
    env_file:
      - .env
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./public/uploads:/app/public/uploads
    environment:
      # Paksa port di dalam container selalu 8787 (konsisten dengan EXPOSE)
      - PORT=8787
      - NODE_ENV=production
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:8787}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8787}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8787/api/youtube/callback}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
